<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Canvas | Bento Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="canvas-wrapper">
        <nav class="top-nav">
            <div class="logo">DataStream.io</div>
            <div class="user-profile">Uday S. Hiremath</div>
        </nav>

        <main class="bento-grid">
            <div class="item featured">
                <h3>System Performance</h3>
                <div class="data-viz">98.4%</div>
                <p>Real-time uptime across all nodes.</p>
            </div>

            <div class="item metric">
                <span>Active Users</span>
                <strong>1,240</strong>
            </div>

            <div class="item metric">
                <span>Total Revenue</span>
                <strong>$12.5k</strong>
            </div>

            <div class="item wide">
                <h3>Sentiment Trend Analysis</h3>
                <div class="chart-placeholder">Trend Graph [Placeholder]</div>
            </div>

            <div class="item tall">
                <h3>System Health</h3>
                <ul class="status-list">
                    <li>CPU: 12%</li>
                    <li>RAM: 4.2GB</li>
                    <li>Latency: 14ms</li>
                </ul>
            </div>

            <div class="item metric">
                <span>Pending Tasks</span>
                <strong>14</strong>
            </div>
        </main>
    </div>
</body>
</html>
